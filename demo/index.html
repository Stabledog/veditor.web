<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>veditor multi-buffer demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #editor-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem 0.75rem;
      background: #181825;
      border-bottom: 1px solid #313244;
    }
    #title-container { flex: 1; min-width: 0; font-size: 0.85rem; font-weight: 600; }
    #status { font-size: 0.875rem; margin-left: auto; }
    #status.success { color: #a6e3a1; }
    #status.error { color: #f38ba8; }
    #buffer-indicator {
      font-size: 0.75rem;
      color: #6c7086;
      padding: 0.2rem 0.5rem;
      background: #313244;
      border-radius: 3px;
    }
    #editor-container { flex: 1; overflow: hidden; position: relative; }
    #help-hint {
      position: fixed;
      bottom: 8px;
      right: 8px;
      font-size: 0.7rem;
      color: #6c7086;
      z-index: 5;
    }
  </style>
</head>
<body>
  <div id="editor-header">
    <div id="title-container"></div>
    <span id="buffer-indicator"></span>
    <span id="status"></span>
  </div>
  <div id="editor-container"></div>
  <div id="help-hint">:ls to switch docs &middot; :bn/:bp next/prev &middot; :bd close buffer</div>

  <script type="module">
    import { createEditor, createVimInput, getEditorContent, destroyEditor, focusEditor, getAutoSaveMs } from '../src/index.ts';

    // --- Simulated document store (like a host app would have) ---
    const docs = [
      {
        id: 'vim-commands',
        title: 'Vim commands',
        body: `# Vim commands

Try these ex commands:

- \`:w\` — save
- \`:q\` — quit (returns to note list)
- \`:wq\` — save and quit
- \`:ls\` — open document picker (MULTI-BUFFER!)
- \`:bn\` — next buffer
- \`:bp\` — previous buffer
- \`:bd\` — close current buffer

Edit this text, then switch buffers to test save-on-switch.
`,
      },
      {
        id: 'markdown-sample',
        title: 'Markdown sample',
        body: `# Markdown sample

## Headings, lists, code

- Item one
- Item two
  - Nested item

\`\`\`javascript
function hello() {
  console.log('world');
}
\`\`\`

> A blockquote for good measure.
`,
      },
      {
        id: 'long-text',
        title: 'Long text (wrap test)',
        body: `# Line wrapping test

This is a very long line that should demonstrate line wrapping behavior. Use :wrap to toggle wrapping on and off. When wrapping is off this line should extend beyond the viewport and require horizontal scrolling. When wrapping is on it should break at the editor boundary.

Short line.

Another very long line to test with: Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris.
`,
      },
      {
        id: 'todo-list',
        title: 'TODO list',
        body: `# Things to do

- [ ] Test multi-buffer switching
- [ ] Verify save-on-switch works
- [ ] Check that undo history is preserved per-buffer
- [ ] Try the fuzzy filter in :ls
- [ ] Confirm Escape dismisses the picker
`,
      },
      {
        id: 'meeting-notes',
        title: 'Meeting notes 2024-01-15',
        body: `# Weekly sync — Jan 15

## Attendees
- Alice, Bob, Charlie

## Decisions
- Ship v2.0 by end of month
- Defer the auth refactor to Q2

## Action items
- Alice: write up the migration plan
- Bob: benchmark the new cache layer
- Charlie: update the runbook
`,
      },
    ];

    const statusEl = document.getElementById('status');
    const bufferIndicatorEl = document.getElementById('buffer-indicator');
    let titleHandle = null;

    function showStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.className = isError ? 'error' : 'success';
      if (!isError) {
        setTimeout(() => { if (statusEl.textContent === msg) statusEl.textContent = ''; }, 2000);
      }
    }

    function updateBufferIndicator(label) {
      bufferIndicatorEl.textContent = label ? `[${label}]` : '';
    }

    // --- Multi-buffer callbacks ---

    function makeCallbacksForDoc(doc) {
      return {
        onSave: async () => {
          const content = getEditorContent();
          doc.body = content;
          if (titleHandle) doc.title = titleHandle.getValue();
          showStatus(`Saved: ${doc.title}`);
          updateBufferIndicator(doc.title);
        },
        onQuit: () => {
          // In the demo, quit just logs
          showStatus('Quit requested (nowhere to go in demo)');
        },
        onListDocuments: async () => {
          // Return all docs — host decides ordering
          return docs.map(d => ({ id: d.id, label: d.title }));
        },
        onLoadDocument: async (id) => {
          const doc = docs.find(d => d.id === id);
          if (!doc) throw new Error(`Doc not found: ${id}`);
          updateBufferIndicator(doc.title);
          if (titleHandle) titleHandle.setValue(doc.title);
          return {
            content: doc.body,
            label: doc.title,
            callbacks: makeCallbacksForDoc(doc),
          };
        },
        onBufferSwitch: (_id, label) => {
          updateBufferIndicator(label);
          if (titleHandle) titleHandle.setValue(label);
        },
      };
    }

    // --- Boot: open first doc directly in multi-buffer mode ---
    const firstDoc = docs[0];
    const callbacks = makeCallbacksForDoc(firstDoc);

    titleHandle = createVimInput(
      document.getElementById('title-container'),
      {
        value: firstDoc.title,
        onEnter: () => focusEditor(),
        onEscape: () => focusEditor(),
        onChange: (v) => { firstDoc.title = v; },
      },
    );

    createEditor(document.getElementById('editor-container'), firstDoc.body, callbacks, {
      storagePrefix: 'veditor_demo',
      autoSaveMs: getAutoSaveMs(),
      initialBufferId: firstDoc.id,
      initialBufferLabel: firstDoc.title,
      normalMappings: {
        'gt': () => titleHandle.focus(),
      },
    });

    updateBufferIndicator(firstDoc.title);
  </script>
</body>
</html>
